<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人体动作 → 机器人关节</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#101820;color:#e8eef2}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:45px auto;padding:0 24px 60px}
h1{font-size:32px;margin-bottom:12px;font-weight:650}p{color:#a9b8c5;line-height:1.8}.tag{color:#71dec3;font-size:13px;letter-spacing:1px}
.toolbar,.global{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:24px 0}button,.file{border:1px solid #3a4b59;background:#20303c;border-radius:8px;color:#edf5fa;padding:10px 16px;cursor:pointer;font:inherit;font-size:14px}
button.primary{background:#71dec3;color:#10241e;border-color:#71dec3;font-weight:650}button:hover,.file:hover{filter:brightness(1.12)}
.file input{display:none}.card{background:#17232d;border:1px solid #30414f;border-radius:14px;padding:22px;margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top strong{font-size:18px}.remove{padding:6px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.ranges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:20px}
label{display:block;font-size:13px;color:#b9c6d0}input,select{display:block;width:100%;padding:9px 10px;margin-top:6px;border:1px solid #40515f;border-radius:6px;background:#101c25;color:#eef5f9;font:inherit;font-size:14px}
.pair{display:flex;gap:8px}.pair input{min-width:0}.preview{background:#101c25;border-radius:8px;padding:15px;margin-top:20px;display:flex;gap:20px;align-items:center}.preview label{flex:1}.preview input{accent-color:#71dec3}.result{min-width:200px;color:#71dec3;font-size:16px}
details{margin-top:16px;color:#aab9c6;font-size:13px}summary{cursor:pointer}details .grid{margin-top:14px}.footer{color:#a9b8c5;font-size:13px;line-height:1.8}#message{min-height:25px;color:#71dec3}.global label{width:170px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.ranges{grid-template-columns:repeat(2,1fr)}.preview{flex-direction:column;align-items:stretch}main{margin-top:25px}h1{font-size:26px}}
</style>
<main>
<div class="tag">MUJOCO · 动作映射配置</div>
<h1>让你选择的动作，驱动你选择的关节。</h1>
<p>添加对应关系，设置人体和机器人的角度范围。拖动每条规则的预览滑块，检查方向与幅度，再导出配置用于相机控制。<br>本页预览角度换算；实际人体识别和物理仿真由本地程序运行。</p>
<div class="toolbar">
<button id="add">＋ 添加对应关系</button>
<label class="file">导入映射配置<input type="file" id="import" accept=".json"></label>
<label class="file">导入机器人关节列表<input type="file" id="manifest" accept=".json"></label>
<button class="primary" id="export">导出 joint_mapping.json</button>
</div>
<div class="global">
<label>识别可信度下限<input id="confidence" type="number" value="0.6" min="0" max="1" step="0.05"></label>
<label>平滑时间（秒）<input id="smoothing" type="number" value="0.12" min="0" step="0.01"></label>
</div>
<div id="message" role="status"></div><div id="rules"></div>
<p class="footer">导出的配置需保存到仿真程序所在文件夹，然后运行关节映射模式。每个机器人关节设置一条规则；同一个人体动作可以驱动多个机器人关节。<br>默认三维角度来自单目姿态估计。机器人模型需有对应的旋转关节与位置执行器；自由站立和行走还需要平衡控制。</p>
</main>
<script>
'use strict';
const names='nose left_eye_inner left_eye left_eye_outer right_eye_inner right_eye right_eye_outer left_ear right_ear mouth_left mouth_right left_shoulder right_shoulder left_elbow right_elbow left_wrist right_wrist left_pinky right_pinky left_index right_index left_thumb right_thumb left_hip right_hip left_knee right_knee left_ankle right_ankle left_heel right_heel left_foot_index right_foot_index'.split(' ');
const labels={left_shoulder:'左肩',right_shoulder:'右肩',left_elbow:'左肘',right_elbow:'右肘',left_wrist:'左腕',right_wrist:'右腕',left_hip:'左髋',right_hip:'右髋',left_knee:'左膝',right_knee:'右膝',left_ankle:'左踝',right_ankle:'右踝'};
const presets={
 right_elbow:{label:'右肘弯曲',landmarks:['right_shoulder','right_elbow','right_wrist']},
 left_elbow:{label:'左肘弯曲',landmarks:['left_shoulder','left_elbow','left_wrist']},
 right_shoulder:{label:'右肩抬臂',landmarks:['right_hip','right_shoulder','right_elbow']},
 left_shoulder:{label:'左肩抬臂',landmarks:['left_hip','left_shoulder','left_elbow']},
 right_knee:{label:'右膝弯曲',landmarks:['right_hip','right_knee','right_ankle']},
 left_knee:{label:'左膝弯曲',landmarks:['left_hip','left_knee','left_ankle']},
 right_hip:{label:'右髋屈曲',landmarks:['right_shoulder','right_hip','right_knee']},
 left_hip:{label:'左髋屈曲',landmarks:['left_shoulder','left_hip','left_knee']}
};
let joints=[{joint:'base_yaw',actuators:['base_servo'],range_deg:[-85.9437,85.9437]},{joint:'shoulder',actuators:['shoulder_servo'],range_deg:[-137.51,45.8366]},{joint:'elbow',actuators:['elbow_servo'],range_deg:[-137.51,137.51]}];
let rules=[makeRule('left_shoulder','base_yaw',[-60,60],[0,120]),makeRule('right_shoulder','shoulder',[-10,-110],[0,150]),makeRule('right_elbow','elbow',[120,0],[30,180])];
function makeRule(preset,joint,robotRange=[0,90],humanRange=[30,180]){return {label:presets[preset].label+' → '+joint,source:{type:'angle',landmarks:[...presets[preset].landmarks],space:'world'},robot_joint:joint,actuator:(joints.find(j=>j.joint===joint)?.actuators||[])[0]||'',human_range_deg:humanRange,robot_range_deg:robotRange,offset_deg:0,max_speed_deg_s:60}}
function el(tag,attrs={},text=''){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);n.textContent=text;return n}
function field(parent,label,key,value,type='number'){const l=el('label',{},label),i=el('input',{'data-key':key,type});i.value=value;if(type==='number')i.step='any';l.append(i);parent.append(l);return i}
function selectField(parent,label,key,options,value){const l=el('label',{},label),s=el('select',{'data-key':key});for(const[v,t]of options)s.append(el('option',{value:v},t));if(!options.some(o=>o[0]===value))s.append(el('option',{value},value));s.value=value;l.append(s);parent.append(l);return s}
function presetFor(rule){return Object.keys(presets).find(k=>rule.source.type==='angle'&&JSON.stringify(presets[k].landmarks)===JSON.stringify(rule.source.landmarks))||'custom'}
function readCard(card){const get=k=>card.querySelector(`[data-key="${k}"]`).value;const kind=get('type');return {label:get('label'),source:{type:kind,space:get('space'),landmarks:Array.from(card.querySelectorAll('[data-landmark]')).slice(0,kind==='angle'?3:2).map(x=>x.value),...(kind==='vector_angle'?{axes:[get('axis0'),get('axis1')]}:{})},robot_joint:get('joint'),actuator:get('actuator'),human_range_deg:[Number(get('h0')),Number(get('h1'))],robot_range_deg:[Number(get('r0')),Number(get('r1'))],offset_deg:Number(get('offset')),max_speed_deg_s:Number(get('speed'))}}
function sync(){rules=Array.from(document.querySelectorAll('.card')).map(readCard)}
function preview(card){const r=readCard(card),angle=Number(card.querySelector('[data-preview]').value),fraction=Math.min(1,Math.max(0,(angle-r.human_range_deg[0])/(r.human_range_deg[1]-r.human_range_deg[0])));let result=r.robot_range_deg[0]+fraction*(r.robot_range_deg[1]-r.robot_range_deg[0])+r.offset_deg;const range=joints.find(j=>j.joint===r.robot_joint)?.range_deg;if(range)result=Math.min(range[1],Math.max(range[0],result));card.querySelector('.result').textContent=`人体 ${angle}° → 机器人 ${Number.isFinite(result)?result.toFixed(1):'--'}°`}
function render(){const root=document.getElementById('rules');root.replaceChildren();rules.forEach((r,index)=>{
 const card=el('section',{class:'card'}),top=el('div',{class:'top'});top.append(el('strong',{},`对应关系 ${index+1}`));const remove=el('button',{class:'remove'},'删除');remove.onclick=()=>{sync();rules.splice(index,1);render()};top.append(remove);card.append(top);
 const grid=el('div',{class:'grid'});const preset=selectField(grid,'人体动作','preset',[...Object.entries(presets).map(([k,p])=>[k,p.label]),['custom','自定义关键点 / 方向角']],presetFor(r));
 const joint=selectField(grid,'机器人关节','joint',joints.map(j=>[j.joint,j.joint]),r.robot_joint);
 selectField(grid,'对应的位置执行器','actuator',(joints.find(j=>j.joint===r.robot_joint)?.actuators||[]).map(a=>[a,a]),r.actuator||'');card.append(grid);
 const ranges=el('div',{class:'ranges'});const human=el('label',{},'人体角度起点 / 终点（°）'),hp=el('div',{class:'pair'});field(hp,'','h0',r.human_range_deg[0]);field(hp,'','h1',r.human_range_deg[1]);human.append(hp);ranges.append(human);
 const robot=el('label',{},'机器人角度起点 / 终点（°）'),rp=el('div',{class:'pair'});field(rp,'','r0',r.robot_range_deg[0]);field(rp,'','r1',r.robot_range_deg[1]);robot.append(rp);ranges.append(robot);
 field(ranges,'额外偏置（°）','offset',r.offset_deg||0);field(ranges,'最大速度（°/秒）','speed',r.max_speed_deg_s||60);
 const reverse=el('button',{},'反向');reverse.onclick=()=>{const a=card.querySelector('[data-key="r0"]'),b=card.querySelector('[data-key="r1"]');[a.value,b.value]=[b.value,a.value];preview(card)};ranges.append(reverse);card.append(ranges);
 const details=el('details'),summary=el('summary',{},'高级：自定义人体关键点与角度计算');details.append(summary);const advanced=el('div',{class:'grid'});field(advanced,'规则名称','label',r.label||'', 'text');
 const kind=selectField(advanced,'计算方式','type',[['angle','三点夹角（第二点是关节）'],['vector_angle','两点方向角（有正负）']],r.source.type);
 selectField(advanced,'坐标来源','space',[['world','估计三维姿态'],['image','画面二维投影']],r.source.space||'world');
 for(let p=0;p<3;p++){const input=selectField(advanced,`关键点 ${p+1}`,'point'+p,names.map(n=>[n,labels[n]||n]),r.source.landmarks[p]||'right_wrist');input.setAttribute('data-landmark','')}
 selectField(advanced,'方向角基准轴','axis0',['x','y','z'].map(a=>[a,a]),r.source.axes?.[0]||'x');selectField(advanced,'方向角第二轴','axis1',['x','y','z'].map(a=>[a,a]),r.source.axes?.[1]||'y');details.append(advanced);card.append(details);
 const pv=el('div',{class:'preview'}),sliderLabel=el('label',{},'拖动人体角度，预览映射结果'),slider=el('input',{type:'range',min:'-180',max:'180',value:'90','data-preview':''});sliderLabel.append(slider);pv.append(sliderLabel,el('output',{class:'result'}));card.append(pv);root.append(card);
 card.addEventListener('input',()=>preview(card));preset.onchange=()=>{sync();if(preset.value!=='custom')rules[index].source={type:'angle',landmarks:[...presets[preset.value].landmarks],space:rules[index].source.space};render()};joint.onchange=()=>{sync();rules[index].actuator=(joints.find(j=>j.joint===joint.value)?.actuators||[])[0]||'';render()};kind.onchange=()=>{sync();render()};preview(card);
 })}
function message(text,error=false){const p=document.getElementById('message');p.textContent=text;p.style.color=error?'#ffb09d':'#71dec3'}
function check(config){if(!Number.isFinite(config.confidence)||config.confidence<0||config.confidence>1)throw Error('可信度应在 0 到 1 之间');if(!Number.isFinite(config.smoothing_seconds)||config.smoothing_seconds<0)throw Error('平滑时间不能为负');if(!config.rules.length)throw Error('请至少添加一条对应关系');const seen=new Set;for(const r of config.rules){if(seen.has(r.robot_joint))throw Error('机器人关节重复：'+r.robot_joint);seen.add(r.robot_joint);if(!r.robot_joint||!r.actuator)throw Error('请选择机器人关节与执行器');if(r.human_range_deg[0]===r.human_range_deg[1])throw Error('人体角度范围的起点和终点不能相同');if(![...r.human_range_deg,...r.robot_range_deg,r.offset_deg,r.max_speed_deg_s].every(Number.isFinite)||r.max_speed_deg_s<=0)throw Error('角度和速度必须是有效数字，速度需大于 0');if(r.source.type==='vector_angle'&&(r.source.axes[0]===r.source.axes[1]||(r.source.space==='image'&&r.source.axes.includes('z'))))throw Error('方向角需要不同坐标轴；二维投影应使用 x/y')}}
document.getElementById('add').onclick=()=>{sync();const available=joints.find(j=>!rules.some(r=>r.robot_joint===j.joint));rules.push(makeRule('right_elbow',available?.joint||joints[0].joint));render();message('已添加规则。请选择人体动作与目标机器人关节。')};
document.getElementById('export').onclick=()=>{try{sync();const config={description:'Custom human-to-robot joint mapping',confidence:Number(document.getElementById('confidence').value),smoothing_seconds:Number(document.getElementById('smoothing').value),rules};check(config);const url=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:'application/json'})),a=el('a',{href:url,download:'joint_mapping.json'});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('配置已导出。将文件保存到仿真程序文件夹，重启关节映射模式即可使用。')}catch(e){message(e.message,true)}};
document.getElementById('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const config=JSON.parse(await file.text());check(config);rules=config.rules;document.getElementById('confidence').value=config.confidence;document.getElementById('smoothing').value=config.smoothing_seconds;render();message('已导入映射配置。')}catch(error){message('导入失败：'+error.message,true)}};
document.getElementById('manifest').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const data=JSON.parse(await file.text());const compatible=data.filter(j=>j.type==='mjJNT_HINGE'&&Array.isArray(j.actuators)&&j.actuators.length);if(!compatible.length)throw Error('列表中没有带执行器的旋转关节');sync();joints=compatible;render();message('已加载 '+joints.length+' 个机器人关节。请为现有规则选择新模型的关节和位置执行器。')}catch(error){message('导入失败：'+error.message,true)}};
render();
</script>
</html>
